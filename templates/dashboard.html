{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h1 style="text-align:center; margin-bottom:30px;">
        📊 Admin Dashboard
    </h1>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>📦 Products</h3>
            <h1>{{ total_products }}</h1>
        </div>

        <div class="dashboard-card">
            <h3>🛒 Orders</h3>
            <h1>{{ total_orders }}</h1>
        </div>

        <div class="dashboard-card">
            <h3>👥 Users</h3>
            <h1>{{ total_users }}</h1>
        </div>

        <div class="dashboard-card">
            <h3>💰 Revenue</h3>
            <h1>₹{{ total_revenue }}</h1>
        </div>

        <div class="dashboard-card">
            <h3>⭐ Reviews</h3>
            <h1>{{ total_reviews }}</h1>
        </div>

        <div class="dashboard-card">
            <h3>❤️ Wishlist</h3>
            <h1>{{ total_wishlist }}</h1>
        </div>

    </div>

    <div class="dashboard-actions">

        <a href="/products/">
            <button class="dashboard-btn">
                🛍 Manage Products
            </button>
        </a>

        <a href="/my-orders/">
            <button class="dashboard-btn">
                📦 View Orders
            </button>
        </a>

        <a href="/admin/">
            <button class="dashboard-btn">
                ⚙ Admin Panel
            </button>
        </a>

    </div>

</div>

{% endblock %}
